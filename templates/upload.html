<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传记录 - 植物智能识别系统</title>
    <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/plant-ui.css">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --info-color: #3498db;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 50px;
        }

        /* 导航栏 */
        .navbar {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }

        .navbar-brand {
            font-weight: bold;
            color: var(--primary-color) !important;
            font-size: 1.5rem;
        }

        /* 主容器 */
        .main-container {
            padding: 100px 0 50px;
        }

        /* 页面标题 */
        .page-header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .page-header h2 {
            font-weight: bold;
            color: #333;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .page-subtitle {
            margin: 12px 0 0;
            color: #6b7280;
            font-size: 0.92rem;
        }

        .page-subtitle code {
            color: #4c5bd4;
            background: #eef2ff;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .page-header h2 i {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 统计卡片 */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .stat-card-1 .stat-icon { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .stat-card-2 .stat-icon { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; }
        .stat-card-3 .stat-icon { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        .stat-card-4 .stat-icon { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
        }

        .stat-label {
            color: #666;
            font-size: 1rem;
        }

        /* 筛选区域 */
        .filter-container {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .filter-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-title i {
            color: var(--primary-color);
        }

        .filter-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .filter-item label {
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
            display: block;
            font-size: 0.9rem;
        }

        .filter-item select,
        .filter-item input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .filter-item select:focus,
        .filter-item input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-filter {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-filter:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-reset {
            background: #f8f9fa;
            color: #666;
            border: 2px solid #e0e0e0;
            padding: 10px 30px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-left: 10px;
        }

        .btn-reset:hover {
            background: #e9ecef;
        }

        /* 记录卡片 */
        .records-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .record-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: all 0.3s;
        }

        .record-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .record-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #f8f9fa;
        }

        .record-content {
            padding: 20px;
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .record-type {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .type-grape { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .type-mango-leaf { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        .type-mango { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; }
        .type-plants { background: linear-gradient(135deg, #43e97b, #38f9d7); color: white; }

        .record-time {
            font-size: 0.85rem;
            color: #999;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .record-folder {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            padding: 4px 9px;
            border-radius: 8px;
            background: #eef2ff;
            color: #4c5bd4;
            font-size: 0.78rem;
            font-family: Consolas, monospace;
        }

        .record-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .record-result {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .result-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
        }

        .record-actions {
            display: flex;
            gap: 10px;
        }

        .btn-view {
            flex: 1;
            padding: 10px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn-view:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .btn-delete {
            padding: 10px 15px;
            background: #fee;
            color: #e74c3c;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-delete:hover {
            background: #e74c3c;
            color: white;
        }

        /* 空状态 */
        .empty-state {
            background: white;
            border-radius: 20px;
            padding: 80px 40px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .empty-state i {
            font-size: 5rem;
            color: #ddd;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: #999;
            margin-bottom: 15px;
        }

        .empty-state p {
            color: #bbb;
            margin-bottom: 30px;
        }

        .btn-start {
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            color: white;
        }

        /* 分页 */
        .pagination-container {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        .pagination {
            display: flex;
            gap: 10px;
            list-style: none;
            padding: 0;
        }

        .page-item {
            display: inline-block;
        }

        .page-link {
            padding: 10px 15px;
            background: white;
            color: var(--primary-color);
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .page-link:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .page-item.active .page-link {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-color: transparent;
        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .records-container {
                grid-template-columns: 1fr;
            }

            .stats-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .filter-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-flower1"></i> 植物智能识别系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">
                            <i class="bi bi-grid-fill"></i> 仪表板
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/upload">
                            <i class="bi bi-cloud-upload"></i> 我的记录
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/statistics">
                            <i class="bi bi-bar-chart-fill"></i> 统计分析
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">
                            <i class="bi bi-box-arrow-right"></i> 退出
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <div class="container main-container">
        <!-- 页面标题 -->
        <div class="page-header">
            <h2>
                <i class="bi bi-clock-history"></i>
                我的识别记录
            </h2>
            <p class="page-subtitle">上传原图按模块和日期保存到 <code>uploads/&lt;模块&gt;/&lt;日期&gt;/</code></p>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-container">
            <div class="stat-card stat-card-1">
                <div class="stat-icon">
                    <i class="bi bi-images"></i>
                </div>
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">总识别次数</div>
            </div>
            <div class="stat-card stat-card-2">
                <div class="stat-icon">
                    <i class="bi bi-check-circle"></i>
                </div>
                <div class="stat-value" id="todayCount">0</div>
                <div class="stat-label">今日识别</div>
            </div>
            <div class="stat-card stat-card-3">
                <div class="stat-icon">
                    <i class="bi bi-cpu"></i>
                </div>
                <div class="stat-value" id="modelCount">4</div>
                <div class="stat-label">使用模型</div>
            </div>
            <div class="stat-card stat-card-4">
                <div class="stat-icon">
                    <i class="bi bi-graph-up"></i>
                </div>
                <div class="stat-value">95%</div>
                <div class="stat-label">平均准确率</div>
            </div>
        </div>

        <!-- 筛选区域 -->
        <div class="filter-container">
            <div class="filter-title">
                <i class="bi bi-funnel"></i>
                筛选条件
            </div>
            <div class="filter-group">
                <div class="filter-item">
                    <label>模型类型</label>
                    <select id="modelType">
                        <option value="">全部模型</option>
                        <option value="grape_disease">葡萄病害</option>
                        <option value="mango_leaf_disease">芒果叶片病害</option>
                        <option value="mango">芒果品种</option>
                        <option value="plants">通用植物病害</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>识别结果</label>
                    <select id="diseaseClass">
                        <option value="">全部结果</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>开始日期</label>
                    <input type="date" id="startDate">
                </div>
                <div class="filter-item">
                    <label>结束日期</label>
                    <input type="date" id="endDate">
                </div>
            </div>
            <div style="margin-top: 20px;">
                <button class="btn-filter" onclick="applyFilter()">
                    <i class="bi bi-search me-2"></i>搜索
                </button>
                <button class="btn-reset" onclick="resetFilter()">
                    <i class="bi bi-arrow-clockwise me-2"></i>重置
                </button>
            </div>
        </div>

        <!-- 记录列表 -->
        <div id="recordsContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>
        </div>

        <!-- 分页 -->
        <div class="pagination-container" id="paginationContainer" style="display: none;">
            <ul class="pagination" id="pagination"></ul>
        </div>
    </div>

    <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="/static/vendor/jquery/jquery.min.js"></script>
    <script>
        let currentPage = 1;
        const perPage = 9;

        // 加载记录
        function loadRecords(page = 1) {
            currentPage = page;

            const modelType = $('#modelType').val();
            const diseaseClass = $('#diseaseClass').val();

            $.ajax({
                url: '/api/user_uploads',
                type: 'GET',
                data: {
                    page: page,
                    per_page: perPage,
                    model_type: modelType,
                    disease_class: diseaseClass,
                    limit: perPage
                },
                success: function(data) {
                    if (data.success) {
                        displayRecords(data.data);
                        updateStats(data.total != null ? data.total : data.data.length);
                        displayPagination(data.pages || 0, page);
                    } else {
                        showError('加载失败');
                    }
                },
                error: function() {
                    $('#recordsContainer').html(`
                        <div class="empty-state">
                            <i class="bi bi-exclamation-triangle"></i>
                            <h3>加载失败</h3>
                            <p>无法加载识别记录，请刷新页面重试</p>
                        </div>
                    `);
                }
            });
        }

        // 显示记录
        function recordFolder(path) {
            const parts = (path || '').split('/').filter(Boolean);
            if (parts[0] === 'uploads' && parts[1]) {
                return `uploads/${parts[1]}`;
            }
            return 'uploads';
        }

        function displayRecords(uploads) {
            if (uploads.length === 0) {
                $('#recordsContainer').html(`
                    <div class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <h3>暂无识别记录</h3>
                        <p>开始您的第一次植物病害识别吧！</p>
                        <a href="/dashboard" class="btn-start">
                            <i class="bi bi-play-circle me-2"></i>开始识别
                        </a>
                    </div>
                `);
                return;
            }

            let html = '<div class="records-container">';

            uploads.forEach(upload => {
                const typeClass = getTypeClass(upload.model_type);
                const typeName = getTypeName(upload.model_type);

                html += `
                    <div class="record-card" style="--plant-delay: ${uploads.indexOf(upload) * 45}ms;">
                        <img src="${upload.image_path}" class="record-image" alt="${upload.image_name}">
                        <div class="record-content">
                            <div class="record-header">
                                <span class="record-type ${typeClass}">${typeName}</span>
                                <span class="record-time">
                                    <i class="bi bi-clock"></i>
                                    ${formatTime(upload.created_at)}
                                </span>
                            </div>
                            <div class="record-folder"><i class="bi bi-folder2-open"></i> ${recordFolder(upload.image_path)}</div>
                            <div class="record-title">${upload.image_name}</div>
                            <div class="record-result">
                                <div class="result-label">识别结果</div>
                                <div class="result-value">${upload.disease_class}</div>
                            </div>
                            <div class="record-actions">
                                <button class="btn-view" onclick="viewDetail('${upload.image_path}', '${upload.disease_class}')">
                                    <i class="bi bi-eye me-2"></i>查看详情
                                </button>
                                <button class="btn-delete" onclick="deleteRecord(${upload.id})">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            $('#recordsContainer').html(html);
        }

        // 显示分页
        function displayPagination(totalPages, currentPage) {
            if (totalPages <= 1) {
                $('#paginationContainer').hide();
                return;
            }

            $('#paginationContainer').show();
            let html = '';

            // 上一页
            if (currentPage > 1) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="loadRecords(${currentPage - 1}); return false;">上一页</a></li>`;
            }

            // 页码
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    html += `<li class="page-item active"><a class="page-link" href="#">${i}</a></li>`;
                } else {
                    html += `<li class="page-item"><a class="page-link" href="#" onclick="loadRecords(${i}); return false;">${i}</a></li>`;
                }
            }

            // 下一页
            if (currentPage < totalPages) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="loadRecords(${currentPage + 1}); return false;">下一页</a></li>`;
            }

            $('#pagination').html(html);
        }

        // 更新统计
        function updateStats(count) {
            $('#totalCount').text(count);
        }

        // 显示错误状态
        function showError(message) {
            $('#recordsContainer').html(`
                <div class="empty-state">
                    <i class="bi bi-exclamation-triangle"></i>
                    <h3>加载失败</h3>
                    <p>${message || '无法加载识别记录，请刷新页面重试'}</p>
                </div>
            `);
        }

        // 获取类型样式
        function getTypeClass(type) {
            const typeMap = {
                '葡萄病害': 'type-grape',
                '葡萄实例分割': 'type-grape',
                '芒果叶片病害': 'type-mango-leaf',
                '芒果叶片病害（诊断）': 'type-mango-leaf',
                '叶片病害分割+多物种识别': 'type-mango-leaf',
                '芒果品种': 'type-mango',
                '植物病害': 'type-plants',
                // 兼容旧的英文格式
                'grape_disease': 'type-grape',
                'grape_segment': 'type-grape',
                'mango_leaf_disease': 'type-mango-leaf',
                'mango': 'type-mango',
                'plants': 'type-plants'
            };
            return typeMap[type] || 'type-plants';
        }

        // 获取类型名称
        function getTypeName(type) {
            const nameMap = {
                '葡萄病害': '葡萄病害',
                '葡萄实例分割': '葡萄分割',
                '芒果叶片病害': '芒果叶片',
                '芒果叶片病害（诊断）': '叶片诊断',
                '叶片病害分割+多物种识别': '叶片分割',
                '芒果品种': '芒果品种',
                '植物病害': '植物病害',
                // 兼容旧的英文格式
                'grape_disease': '葡萄病害',
                'grape_segment': '葡萄分割',
                'mango_leaf_disease': '芒果叶片',
                'mango': '芒果品种',
                'plants': '植物病害'
            };
            return nameMap[type] || type;
        }

        // 格式化时间
        function formatTime(timeStr) {
            if (!timeStr) return 'Invalid Date';

            try {
                // 数据库统一按 UTC 保存（SQLite CURRENT_TIMESTAMP），
                // 这里转成浏览器本地时区，东八区会自动显示为 +8 小时。
                let normalized = String(timeStr).trim().replace(' ', 'T');
                if (!/(Z|[+-]\d{2}:?\d{2})$/.test(normalized)) {
                    normalized += 'Z';
                }
                const date = new Date(normalized);

                if (isNaN(date.getTime())) {
                    return 'Invalid Date';
                }

                const diff = Date.now() - date.getTime();
                const fullTime = date.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                });

                if (diff < 0) {
                    // 未来时间（时钟误差），直接显示本地时间
                    return fullTime;
                }

                if (diff < 60000) { // 1分钟内
                    return '刚刚';
                } else if (diff < 3600000) { // 1小时内
                    return Math.floor(diff / 60000) + '分钟前';
                } else if (diff < 86400000) { // 24小时内
                    return Math.floor(diff / 3600000) + '小时前';
                } else if (diff < 604800000) { // 7天内
                    return Math.floor(diff / 86400000) + '天前';
                } else {
                    return date.toLocaleDateString('zh-CN', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    });
                }
            } catch (error) {
                console.error('时间格式化错误:', error, timeStr);
                return 'Invalid Date';
            }
        }

        // 查看详情
        function viewDetail(imagePath, result) {
            alert(`图片：${imagePath}\n识别结果：${result}`);
            // 这里可以打开模态框显示详细信息
        }

        // 删除记录
        function deleteRecord(id) {
            if (!confirm('确定要删除这条记录吗？')) return;

            $.ajax({
                url: `/api/delete_record/${id}`,
                type: 'DELETE',
                success: function(response) {
                    if (response.success) {
                        alert('删除成功！');
                        loadRecords(currentPage); // 重新加载当前页
                    } else {
                        alert('删除失败: ' + (response.error || '未知错误'));
                    }
                },
                error: function(xhr) {
                    const error = xhr.responseJSON?.error || '删除失败，请重试';
                    alert(error);
                }
            });
        }

        // 应用筛选
        function applyFilter() {
            loadRecords(1);
        }

        // 重置筛选
        function resetFilter() {
            $('#modelType').val('');
            $('#diseaseClass').val('');
            $('#startDate').val('');
            $('#endDate').val('');
            loadRecords(1);
        }

        // 页面加载时
        $(document).ready(function() {
            loadRecords(1);
        });
    </script>
</body>
</html>
