<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物智能识别系统 - 登录</title>
    <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/plant-ui.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #2E5EAA 0%, #5B8FC8 100%);
            --success-gradient: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            --danger-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --warning-gradient: linear-gradient(135deg, #89CFF0 0%, #5DADE2 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* 动态背景 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: #fff;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 200px;
            height: 200px;
            background: #fff;
            top: 60%;
            right: 15%;
            animation-delay: 3s;
        }

        .shape-3 {
            width: 150px;
            height: 150px;
            background: #fff;
            bottom: 20%;
            left: 20%;
            animation-delay: 6s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.9); }
            75% { transform: translate(20px, 30px) scale(1.05); }
        }

        /* 主容器 */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            margin: 20px;
        }

        /* 卡片 */
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            min-height: 600px;
        }

        /* 左侧信息栏 */
        .info-section {
            flex: 1;
            background: var(--primary-gradient);
            color: white;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .info-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .info-content {
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo i {
            font-size: 3rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .info-section h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .info-section p {
            font-size: 1.1rem;
            line-height: 1.8;
            opacity: 0.95;
        }

        .features {
            margin-top: 40px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .feature-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(10px);
        }

        .feature-item i {
            font-size: 2rem;
        }

        .feature-text h4 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .feature-text p {
            font-size: 0.9rem;
            opacity: 0.9;
            margin: 0;
        }

        /* 右侧登录表单 */
        .form-section {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-title h3 {
            font-size: 2rem;
            font-weight: bold;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .form-title p {
            color: #666;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group-custom {
            position: relative;
        }

        .input-group-custom i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 1.2rem;
            z-index: 2;
        }

        .form-control-custom {
            width: 100%;
            padding: 15px 20px 15px 55px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 1rem;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .form-control-custom:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .btn-primary-custom {
            width: 100%;
            padding: 15px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-primary-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-primary-custom:active {
            transform: translateY(-1px);
        }

        .btn-outline-custom {
            width: 100%;
            padding: 15px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 15px;
            color: #667eea;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
        }

        .btn-outline-custom:hover {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .divider span {
            background: white;
            padding: 0 15px;
            color: #999;
            font-size: 0.9rem;
        }

        /* 统计卡片 */
        .stats-row {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-5px);
        }

        .stat-card h3 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 0.9rem;
            opacity: 0.9;
            margin: 0;
        }

        /* 响应式 */
        @media (max-width: 992px) {
            .login-card {
                flex-direction: column;
            }

            .info-section,
            .form-section {
                padding: 40px 30px;
            }

            .stats-row {
                flex-wrap: wrap;
            }

            .stat-card {
                flex: 0 0 calc(50% - 10px);
            }
        }

        @media (max-width: 576px) {
            .login-container {
                margin: 10px;
            }

            .info-section,
            .form-section {
                padding: 30px 20px;
            }

            .logo {
                font-size: 2rem;
            }

            .info-section h2 {
                font-size: 1.5rem;
            }

            .stat-card {
                flex: 0 0 100%;
            }
        }

        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 提示消息 */
        .alert-custom {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <!-- 动态背景 -->
    <div class="bg-animation">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
    </div>

    <!-- 主容器 -->
    <div class="login-container">
        <div class="login-card">
            <!-- 左侧信息栏 -->
            <div class="info-section">
                <div class="info-content">
                    <div class="logo">
                        <i class="bi bi-flower1"></i>
                        <span>植物智能识别</span>
                    </div>

                    <h2>基于深度学习的植物病害诊断系统</h2>
                    <p>利用先进的深度学习技术，为您提供精准、快速的植物病害识别服务</p>

                    <div class="features">
                        <div class="feature-item">
                            <i class="bi bi-cpu"></i>
                            <div class="feature-text">
                                <h4>多场景识别</h4>
                                <p>葡萄病害、果实分割、芒果品种、芒果叶片病害、叶片分割+识别，共 5 个入口</p>
                            </div>
                        </div>
                        <div class="feature-item">
                            <i class="bi bi-lightning-charge"></i>
                            <div class="feature-text">
                                <h4>高精度识别</h4>
                                <p>葡萄病害 99.9% · 芒果品种 100% · 芒果叶片 99.8% · 叶片分割+识别 71%</p>
                            </div>
                        </div>
                        <div class="feature-item">
                            <i class="bi bi-clock-history"></i>
                            <div class="feature-text">
                                <h4>快速响应</h4>
                                <p>混合精度训练 + 显存优化 | 推理<1秒</p>
                            </div>
                        </div>
                        <div class="feature-item">
                            <i class="bi bi-shield-check"></i>
                            <div class="feature-text">
                                <h4>训练优化</h4>
                                <p>早停机制 + 标签平滑 + 学习率预热</p>
                            </div>
                        </div>
                    </div>

                    <div class="stats-row">
                        <div class="stat-card">
                            <h3>38</h3>
                            <p>识别类别</p>
                        </div>
                        <div class="stat-card">
                            <h3>6</h3>
                            <p>AI模型</p>
                        </div>
                        <div class="stat-card">
                            <h3>93%</h3>
                            <p>平均准确率</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧登录表单 -->
            <div class="form-section">
                <div class="form-title">
                    <h3>欢迎回来</h3>
                    <p>登录您的账户开始使用</p>
                </div>

                <!-- 提示消息 -->
                <div id="alert-success" class="alert-custom alert-success">
                    <i class="bi bi-check-circle me-2"></i><span id="success-msg"></span>
                </div>
                <div id="alert-error" class="alert-custom alert-danger">
                    <i class="bi bi-exclamation-triangle me-2"></i><span id="error-msg"></span>
                </div>

                <!-- 登录表单 -->
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="bi bi-person"></i> 用户名
                        </label>
                        <div class="input-group-custom">
                            <i class="bi bi-person-circle"></i>
                            <input type="text" id="username" class="form-control-custom"
                                   placeholder="请输入用户名" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <i class="bi bi-lock"></i> 密码
                        </label>
                        <div class="input-group-custom">
                            <i class="bi bi-shield-lock"></i>
                            <input type="password" id="password" class="form-control-custom"
                                   placeholder="请输入密码" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary-custom">
                        <i class="bi bi-box-arrow-in-right me-2"></i>立即登录
                    </button>
                </form>

                <div class="divider">
                    <span>或</span>
                </div>

                <button type="button" class="btn-outline-custom" id="registerBtn">
                    <i class="bi bi-person-plus me-2"></i>注册新账户
                </button>

                <!-- 加载动画 -->
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 15px; color: #667eea;">正在处理...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/vendor/jquery/jquery.min.js"></script>
    <script>
        // 显示提示消息
        function showAlert(type, message) {
            const alertId = type === 'success' ? '#alert-success' : '#alert-error';
            const msgId = type === 'success' ? '#success-msg' : '#error-msg';

            $(msgId).text(message);
            $(alertId).fadeIn();

            setTimeout(() => {
                $(alertId).fadeOut();
            }, 3000);
        }

        // 显示/隐藏加载动画
        function toggleLoading(show) {
            if (show) {
                $('#loading').show();
                $('.btn-primary-custom, .btn-outline-custom').prop('disabled', true);
            } else {
                $('#loading').hide();
                $('.btn-primary-custom, .btn-outline-custom').prop('disabled', false);
            }
        }

        // 登录表单提交
        $('#loginForm').on('submit', function(e) {
            e.preventDefault();

            const username = $('#username').val().trim();
            const password = $('#password').val().trim();

            if (!username || !password) {
                showAlert('error', '请填写完整信息');
                return;
            }

            toggleLoading(true);

            $.ajax({
                url: '/login',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ username, password }),
                success: function(response) {
                    toggleLoading(false);
                    if (response.success) {
                        showAlert('success', '登录成功！正在跳转...');
                        setTimeout(() => {
                            window.location.href = '/dashboard';
                        }, 1000);
                    } else {
                        showAlert('error', response.error || '登录失败，请检查用户名和密码');
                    }
                },
                error: function(xhr) {
                    toggleLoading(false);
                    const error = xhr.responseJSON?.error || '网络错误，请稍后重试';
                    showAlert('error', error);
                }
            });
        });

        // 注册按钮
        $('#registerBtn').on('click', function() {
            window.location.href = '/register';
        });

        // 回车登录
        $('#password').on('keypress', function(e) {
            if (e.which === 13) {
                $('#loginForm').submit();
            }
        });

        // 输入框聚焦效果
        $('.form-control-custom').on('focus', function() {
            $(this).parent().find('i').css('color', '#667eea');
        }).on('blur', function() {
            $(this).parent().find('i').css('color', '#999');
        });
    </script>
</body>
</html>
